name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  build:
    if: github.repository == 'veilux-lab/keyward' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify
        run: |
          make verify
          go test -tags integration -run '^$' ./...
      - name: Build native CLI
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          version="0.1.$((RELEASE_RUN_NUMBER + 1))"
          mkdir -p bin/release
          go build -trimpath -ldflags "-X github.com/veilux-lab/keyward/internal/cli.Version=$version" -o bin/release/keyward ./cmd/keyward
          test "$(bin/release/keyward version)" = "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.arch }}
          path: bin/release/keyward
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: keyward-release-main
      # Keep pending pushes instead of replacing all but the newest one.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Select release type
        env:
          KEYWARD_SIGNED_RELEASES: ${{ vars.KEYWARD_SIGNED_RELEASES }}
        run: |
          case "$KEYWARD_SIGNED_RELEASES" in
            ""|false) release_type=source ;;
            true) release_type=signed ;;
            *) echo 'KEYWARD_SIGNED_RELEASES must be true or false' >&2; exit 1 ;;
          esac
          echo "RELEASE_TYPE=$release_type" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: env.RELEASE_TYPE == 'signed'
        with:
          name: unsigned-arm64
          path: bin/release/unsigned/arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: env.RELEASE_TYPE == 'signed'
        with:
          name: unsigned-amd64
          path: bin/release/unsigned/amd64
      - name: Prepare exact source release
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="0.1.$((RELEASE_RUN_NUMBER + 1))"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          go run ./cmd/keyward-release -version "$version" -out bin/release
      - name: Verify Homebrew source installation
        run: bash scripts/test-homebrew-release.sh "$RELEASE_VERSION" bin/release
      - name: Sign and notarize universal CLI
        if: env.RELEASE_TYPE == 'signed'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/sign-release.sh "$RELEASE_VERSION" bin/release
      - name: Record release provenance and checksums
        run: |
          python3 scripts/prepare-release.py "$RELEASE_VERSION" bin/release --release-type "$RELEASE_TYPE"
          cd bin/release
          shasum -a 256 -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          GH_REPO: veilux-lab/keyward
        run: |
          gh auth setup-git --hostname github.com
          bash scripts/publish-release.sh "$RELEASE_VERSION" bin/release "$RELEASE_TYPE"
      - name: Update Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          bash scripts/update-homebrew.sh bin/release/Formula/keyward.rb
      - name: Mark the current version latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          GH_REPO: veilux-lab/keyward
        run: |
          git fetch --no-tags origin main
          current=$(git show FETCH_HEAD:Formula/keyward.rb | sed -n 's/^  version "\([^"]*\)"$/\1/p')
          if [ "$current" = "$RELEASE_VERSION" ]; then
            gh release edit "v$RELEASE_VERSION" --latest
          fi
